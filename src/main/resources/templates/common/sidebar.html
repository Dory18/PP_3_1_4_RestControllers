<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>

<nav th:fragment="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse min-vh-100 border-end px-0">
    <div class="position-sticky">
        <ul class="nav nav-pills flex-column pt-3 px-0">
            <li sec:authorize="hasRole('ROLE_ADMIN')" class="nav-item w-100">
                <a th:class="${#httpServletRequest.requestURI == '/admin'} ? 'nav-link active rounded-0' : 'nav-link text-dark'"
                   th:href="@{/admin}">
                    Admin
                </a>
            </li>
            <li sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_USER')" class="nav-item w-100">
                <a th:class="${#httpServletRequest.requestURI == '/user'} ? 'nav-link active rounded-0' : 'nav-link text-dark'"
                   th:href="@{/user}">
                    User
                </a>
            </li>
        </ul>
    </div>
</nav>

</body>
</html>
