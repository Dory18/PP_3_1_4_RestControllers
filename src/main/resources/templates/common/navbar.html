<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-3">
        <span class="navbar-text text-white fw-bold fs-5" th:if="${#authorization.expression('isAuthenticated()')}">

            <span th:text="${#authentication.principal.email}"></span>

            <span class="fw-normal text-light mx-1">with roles:</span>

            <span th:each="auth : ${#authentication.principal.authorities}"
                  th:text="${auth.authority}"
                  class="text-light ms-1 fw-normal">
            </span>
        </span>

        <div class="d-flex">
            <a class="px-3 text-secondary text-decoration-none" th:href="@{/logout}">Logout</a>
        </div>

    </div>
</nav>

</body>
</html>
