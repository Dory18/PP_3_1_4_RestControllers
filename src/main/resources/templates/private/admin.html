<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link class="icon" type="image/png" th:href="@{/icons/icons8-spring-16.png}" sizes="16x16">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
<nav th:replace="~{common/navbar :: navbar}"></nav>
<div class="container-fluid bg-light">
    <div class="row">
        <nav th:replace="~{common/sidebar :: sidebar}"></nav>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-3">
            <h1 class="ms-3 mb-8">Admin panel</h1>

            <div class="bg-transparent ms-3">
                <ul class="nav nav-tabs border-bottom-0 mb-0 pb-0" role="tablist" id="adminTabs">
                    <li>
                        <button class="nav-link active"
                                id="nav-users-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#nav-users"
                                type="button"
                                role="tab"
                                aria-controls="nav-users"
                                aria-selected="true">Users table
                        </button>
                    </li>
                    <li>
                        <button class="nav-link"
                                id="nav-new-user-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#nav-new-user"
                                type="button"
                                role="tab"
                                aria-controls="nav-new-user"
                                aria-selected="false">New user
                        </button>
                    </li>
                </ul>
            </div>

            <div class="tab-content ms-3 bg-light">
                <div id="nav-users" class="tab-pane fade show active" role="tabpanel" aria-labelledby="nav-users-tab">
                    <div th:replace="~{private/users_table :: users_table}"></div>
                </div>
                <div id="nav-new-user" class="tab-pane fade" role="tabpanel" aria-labelledby="nav-new-user-tab">
                    <div th:replace="~{private/create :: create}"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

<script th:src="@{/js/adminApp.js}"></script>
</body>
</html>
