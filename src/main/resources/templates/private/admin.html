<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link rel="icon" type="image/png" th:href="@{/icons/icons8-spring-16.png}" sizes="16x16">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

</head>
<body>
<nav th:replace="~{common/navbar :: navbar}"></nav>
<div class="container-fluid bg-light">
    <div class="row">
        <nav th:replace="~{common/sidebar :: sidebar}"></nav>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-3">
            <h1 class="ms-3 mb-8">Admin panel</h1>
            <div class="bg-transparent ms-3">
                <ul class="nav nav-tabs border-bottom-0 mb-0 pb-0" role="tablist">
                    <li>
                        <button class="nav-link"
                                th:classappend="${tabError} ? '' : 'active'"
                                data-bs-toggle="tab"
                                data-bs-target="#users-content">Users table
                        </button>
                    </li>
                    <li>
                        <button class="nav-link"
                                th:classappend="${tabError} ? 'active' : ''"
                                data-bs-toggle="tab"
                                data-bs-target="#new-user-content">New user
                        </button>
                    </li>
                </ul>
            </div>
            <div class="tab-content ms-3 bg-light">
                <div id="users-content" class="tab-pane fade"
                     th:classappend="${tabError} ? '' : 'show active'">
                    <div th:replace="~{private/users_table :: users_table}"></div>
                </div>

                <div id="new-user-content" class="tab-pane fade"
                     th:classappend="${tabError} ? 'show active' : ''">
                    <div th:replace="~{private/create :: create}"></div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
