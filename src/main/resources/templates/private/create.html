<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
<div th:fragment="create" class="border border-top-0">
    <p class="caption-top bg-light text-dark border fs-5 py-2 ps-3 pe-1 m-0 fw-medium">Add new user</p>
    <div class="container mt-5 content text-center">
        <form th:method="POST" th:action="@{/admin}" th:object="${user}"
              class="row g-3 align-items-center needs-validation"
              novalidate>
            <div class="col-sm-5 offset-sm-3">
                <label for="firstName" class="fw-bold">First name</label>
                <input type="text" id="firstName" placeholder="First name" th:field="*{firstName}"
                       class="form-control"/>
                <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>

                <label for="lastName" class="fw-bold">Last name</label>
                <input type="text" id="lastName" placeholder="Last name" th:field="*{lastName}" class="form-control"/>
                <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>

                <label for="age" class="fw-bold">Age</label>
                <input type="number" id="age" placeholder="Age" th:field="*{age}" class="form-control"/>
                <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>

                <label for="email" class="fw-bold">Email</label>
                <input type="email" id="email" placeholder="Email" th:field="*{email}" class="form-control"/>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

                <label for="password" class="fw-bold">Password</label>
                <input type="password" id="password" placeholder="Password" th:field="*{password}"
                       class="form-control"/>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

                <label for="role" class="fw-bold">Role</label>
                <select id="role" th:name="roles" class="form-select" th:size="${#lists.size(allRoles)}" multiple>
                    <option th:each="role, iterStat : ${allRoles}"
                            th:value="${role.id}"
                            th:text="${role.name}"
                            th:selected="${iterStat.first}">ADMIN
                    </option>

                </select>
                <button type="submit" class="btn btn-success m-4 p-3">Add new user</button>
            </div>

        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
