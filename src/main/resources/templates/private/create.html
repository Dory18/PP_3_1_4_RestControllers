<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Добавление пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>

<div th:fragment="create" class="border border-top-0">
    <p class="caption-top bg-light text-dark border fs-5 py-2 ps-3 pe-1 m-0 fw-medium">Add new user</p>
    <div class="container mt-5 content text-center">
        <form id="add-user-form" class="row g-3 align-items-center needs-validation" novalidate>
            <div class="col-sm-5 offset-sm-3">
                <label for="firstName" class="fw-bold">First name</label>
                <input type="text" id="firstName" placeholder="First name" class="form-control" required/>
                <div class="invalid-feedback" id="error-firstName"></div>

                <label for="lastName" class="fw-bold mt-2">Last name</label>
                <input type="text" id="lastName" placeholder="Last name" class="form-control" required/>
                <div class="invalid-feedback" id="error-lastName"></div>

                <label for="age" class="fw-bold mt-2">Age</label>
                <input type="number" id="age" placeholder="Age" class="form-control" required/>
                <div class="invalid-feedback" id="error-age"></div>

                <label for="email" class="fw-bold mt-2">Email</label>
                <input type="email" id="email" placeholder="Email" class="form-control" required/>
                <div class="invalid-feedback" id="error-email"></div>

                <label for="password" class="fw-bold mt-2">Password</label>
                <input type="password" id="password" placeholder="Password" class="form-control" required/>
                <div class="invalid-feedback" id="error-password"></div>

                <label for="role" class="fw-bold mt-2">Role</label>
                <select id="role" class="form-select" multiple required></select>
                <div class="invalid-feedback" id="error-roles"></div>

                <button type="submit" class="btn btn-success m-4 p-3">Add new user</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    if (typeof fillCreateUserRolesSelect === 'function') {
        fillCreateUserRolesSelect();
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
<script src="/js/adminApp.js" defer></script>
</body>
</html>
