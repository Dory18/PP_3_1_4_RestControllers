<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User page</title>
    <link rel="icon" type="image/png" th:href="@{/icons/icons8-spring-16.png}" sizes="16x16">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
<nav th:replace="~{common/navbar :: navbar}"></nav>
<div class="container-fluid bg-light">
    <div class="row">
        <nav th:replace="~{common/sidebar :: sidebar}"></nav>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-3">
            <h1 class="ms-3 mb-8">User information-page</h1>
            <p class="caption-top bg-light text-dark border fs-5 py-2 ps-3 pe-1 m-0 fw-medium ms-3 mt-0">About user</p>
            <div class="bg-white ms-3 rounded shadow-sm border border-top-0 p-4 m-0 rounded-0 table-responsive">
                <table class="table table-striped align-middle">
                    <thead class="border-top">
                    <tr class="align-middle">
                        <th scope="col" class="py-3">ID</th>
                        <th scope="col">FirstName</th>
                        <th scope="col">LastName</th>
                        <th scope="col">Age</th>
                        <th scope="col">Email</th>
                        <th scope="col">Role</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td class="py-3" th:text="${user.id}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.age}"></td>
                        <td th:text="${user.email}"></td>
                        <td class="text-nowrap">
                    <span th:each="role, iterStat : ${user.roles}"
                          th:text="${role.name} + ${!iterStat.last ? ', ' : ''}">
                    </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

</body>
</html>
