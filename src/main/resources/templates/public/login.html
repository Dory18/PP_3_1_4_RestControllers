<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login page</title>
    <link rel="icon" type="image/png"  th:href="@{/icons/icons8-spring-16.png}" sizes="16x16">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
<div class="d-flex justify-content-center">
    <div class="mt-5 w-25">
        <h3 class="fw-bold">Please sign in</h3>
        <form th:method="POST" th:action="@{/login}">
            <div class="col-9">
                <input name="username" type="text" id="username" class="form-control"
                       placeholder="Email address"/>
            </div>
            <div class="col-9">
                <input name="password" type="text" id="password" class="form-control"
                       placeholder="Password"/>
            </div>
            <div class="col-9 mt-1">
                <input type="submit" value="Sign in" class="btn btn-primary w-100">
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
